<!DOCTYPE html>
<html>
    <head>
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <header>
            <p>Tic Tac Toe</p>
            <nav>
                <a href="index.html">Back to Portfolio</a>
            </nav>
        </header>

        <main>
            <h1>Tic Tac Toe</h1>

            <div id="player-data">
                <p>Current Player: <span id="current-player">X</span></p>
                <p id="message"></p>
            </div>

            <div class="container">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>

            <h2>Scoreboard</h2>
            <p id="x-score">X: 0</p>
            <p id="o-score">O: 0</p>
            <p id="draw-score">Draws: 0</p>

            <button id="reset">Reset Game</button>
        </main>

        <script src="script.js"></script>
    </body>
</html>
